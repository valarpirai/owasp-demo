server:
  port: 8090
  bind_address: 127.0.0.1

session:
  timeout_minutes: 5
  same_site: Lax
  cookie_name: OWASP_SID

security:
  public_paths:
    - /login
    - /logout
  headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY

csrf:
  default_email: alice@example.com
  attacker_email: attacker@evil.example

rce:
  safe_host_pattern: "^[a-zA-Z0-9._-]{1,253}$"
  separator_pattern: "\\s*(?:;|&&|\\|\\||\\||&)\\s*"
  allowed_command_pattern: "ls(?: [A-Za-z0-9._/-]+)*"
  demo_hosts:
    - localhost
    - example.com
    - 127.0.0.1

java4shell:
  max_input_chars: 4096
  preview_bytes: 32
  affected_java_versions: [17, 21, 25, 27]
  required_cpu_flags: [avx512f, avx512bw, avx512vbmi, bmi2]
  mitigation_flags:
    - "-XX:-UseBASE64Intrinsics"
    - "-XX:UseAVX=2"

db_browser:
  default_page_size: 10

database:
  url: jdbc:h2:mem:owaspdb;DB_CLOSE_DELAY=-1
  username: sa
  password: ""

app:
  name: "OWASP Top 10 Demo"
  seed:
    admin:
      username: admin
      password: admin123
      role: ADMIN
    user:
      username: user
      password: user123
      role: USER

ssrf:
  allowlist:
    - "https://httpbin.org"
    - "https://jsonplaceholder.typicode.com"

auth:
  max_failed_attempts: 3
  lockout_minutes: 5

otp:
  max_attempts: 5
  correct_code: "123456"

integrity:
  hmac_secret: "change-me-in-production-use-32-chars-min"
