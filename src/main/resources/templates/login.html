<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">OWASP Demo</h1>
    <p class="text-center text-sm text-gray-500 mb-6">Sign in to continue</p>
    {error}
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400"/>
      </div>
      <button type="submit"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm">
        Sign In
      </button>
    </form>
    <div class="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded text-xs text-gray-600">
      <strong>Demo credentials:</strong><br/>
      Username: <code>{hint_user}</code> &nbsp; Password: <code>{hint_pass}</code>
    </div>
  </div>
</div>
