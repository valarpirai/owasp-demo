<form method="POST" action="/java4shell/mitigated" class="space-y-3">
  <label class="block text-sm font-medium text-gray-700">Base64 data to decode</label>
  <input type="text" name="data2" placeholder="e.g. SGVsbG8gSmF2YTRTaGVsbA=="
    value="{value}"
    class="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono"/>
  <p class="text-xs text-gray-500">At most {limit} characters. Only <code>A-Z a-z 0-9 + /</code> and <code>=</code> padding.</p>
  <button class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">Decode (Validated)</button>
</form>
